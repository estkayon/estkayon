name: Build profile graphics

# Builds the live Voyage Log cards and the framed contribution snake, then
# publishes them to the "output" branch that README.md reads from.
# Everything is in ONE workflow on purpose: publishing replaces the whole
# branch, so a second workflow would wipe these files. (This file keeps the
# old name, snake.yml, so copying it in replaces the previous snake workflow.)

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Voyage Log cards (contributions, tech stack, monthly, best day)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a classic PAT (read:user) saved as GH_STATS_TOKEN adds private contributions.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/generate_voyage.py --user ${{ github.repository_owner }} --out dist

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snk/snake.svg?color_snake=#f4a63a&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Put the snake on the dashboard panel
        run: python scripts/generate_voyage.py --frame-snake snk/snake.svg dist/snake.svg

      - name: Publish to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}