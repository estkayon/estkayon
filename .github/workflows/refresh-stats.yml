name: Refresh Stats Cards

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download cards
        run: |
          mkdir -p assets

          fetch () {
            url="$1"; dest="$2"
            code=$(curl -sSL --retry 3 --retry-delay 10 -w "%{http_code}" "$url" -o /tmp/card.svg)
            size=$(stat -c%s /tmp/card.svg 2>/dev/null || echo 0)
            echo "--- $dest"
            echo "    HTTP $code, ${size} bytes"
            echo "    first line: $(head -c 120 /tmp/card.svg)"
            if [ "$code" = "200" ] && grep -q "<svg" /tmp/card.svg; then
              mv /tmp/card.svg "$dest"
              echo "    SAVED"
            else
              echo "    REJECTED"
            fi
          }

          fetch "https://github-readme-stats.shion.dev/api?username=estkayon&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true" assets/stats.svg
          fetch "https://github-readme-stats.shion.dev/api/top-langs/?username=estkayon&theme=tokyonight&hide_border=true&layout=compact&langs_count=8" assets/top-langs.svg
          fetch "https://streak-stats.demolab.com/?user=estkayon&hide_border=true&background=0D1117&border=0D1117&stroke=FF6B00&ring=FF4500&fire=FF4500&currStreakNum=FF6B00&currStreakLabel=FF4500&sideNums=FFFFFF&sideLabels=FFA500&dates=8B949E" assets/streak.svg

          echo "=== contents of assets/ ==="
          ls -la assets/

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh stats cards"
            git push
            echo "pushed"
          fi